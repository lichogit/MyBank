{% extends 'bank_app/base.html' %}

{% block content %}
<div class="card" style="text-align: center; padding: 4rem 2rem;">
    <h1 style="font-size: 4rem; color: var(--danger); margin-bottom: 1rem;">500</h1>
    <h2 style="font-size: 1.5rem; color: var(--dark); margin-bottom: 2rem;">Server Error</h2>
    <p style="color: var(--gray); margin-bottom: 2rem;">Something went wrong on our end. We've logged the issue and will fix it shortly.</p>
    
    {% if error %}
    <div style="background-color: var(--light); padding: 1rem; border-radius: 0.375rem; text-align: left; max-width: 600px; margin: 0 auto 2rem auto; overflow-x: auto;">
        <p style="font-weight: 600; margin-bottom: 0.5rem; font-size: 0.875rem;">Error Details (Visible only in debug):</p>
        <code style="color: var(--danger); font-size: 0.875rem;">{{ error }}</code>
    </div>
    {% endif %}
    
    <a href="{% url 'dashboard' %}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
