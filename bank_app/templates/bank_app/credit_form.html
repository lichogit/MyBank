{% extends 'bank_app/base.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 class="card-title">Grant Credit to {{ client }}</h2>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Credit Type</label>
            {{ form.credit_type }}
        </div>
        
        <div class="form-group">
            <label class="form-label">Amount (BGN)</label>
            {{ form.amount }}
        </div>
        
        <div class="form-group">
            <label class="form-label">Period (Months)</label>
            {{ form.period_months }}
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Grant & Generate Plan</button>
            <a href="{% url 'client_detail' client.id %}" class="btn btn-outline" style="margin-left: 0.5rem;">Cancel</a>
        </div>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        document.querySelectorAll('input, select').forEach(el => el.classList.add('form-control'));
    });
</script>
{% endblock %}
