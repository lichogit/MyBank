{% extends 'index.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 class="card-title">Register New Client</h2>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Client Type</label>
            {{ form.client_type }}
        </div>
        
        <div id="individual-fields" style="display: none;">
            <div class="form-group">
                <label class="form-label">First Name</label>
                {{ form.first_name }}
            </div>
            <div class="form-group">
                <label class="form-label">Last Name</label>
                {{ form.last_name }}
            </div>
            <div class="form-group">
                <label class="form-label">Personal ID (EGN)</label>
                {{ form.personal_id }}
            </div>
        </div>

        <div id="corporate-fields" style="display: none;">
            <div class="form-group">
                <label class="form-label">Company Name</label>
                {{ form.company_name }}
            </div>
            <div class="form-group">
                <label class="form-label">Company ID (EIK)</label>
                {{ form.company_id }}
            </div>
            <div class="form-group">
                <label class="form-label">Representative Name</label>
                {{ form.representative_name }}
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Save Client</button>
            <a href="{% url 'client_list' %}" class="btn btn-outline" style="margin-left: 0.5rem;">Cancel</a>
        </div>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const typeSelect = document.querySelector('select[name="client_type"]');
        const indFields = document.getElementById('individual-fields');
        const corpFields = document.getElementById('corporate-fields');

        // Add form-control class to all inputs/selects
        document.querySelectorAll('input, select').forEach(el => el.classList.add('form-control'));

        function toggleFields() {
            if (typeSelect.value === 'INDIVIDUAL') {
                indFields.style.display = 'block';
                corpFields.style.display = 'none';
            } else if (typeSelect.value === 'CORPORATE') {
                indFields.style.display = 'none';
                corpFields.style.display = 'block';
            } else {
                indFields.style.display = 'none';
                corpFields.style.display = 'none';
            }
        }

        typeSelect.addEventListener('change', toggleFields);
        toggleFields();
    });
</script>
{% endblock %}
